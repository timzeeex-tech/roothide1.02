name: Build Roothide1.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git perl unzip curl wget lld

      - name: Setup Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Toolchain
        run: |
          set -e
          mkdir -p $HOME/theos/toolchain/linux/iphone
          git clone --depth=1 https://github.com/theos/llvm-project.git $HOME/theos/toolchain/linux/iphone
          ln -sf $HOME/theos/toolchain/linux/iphone/bin/clang $HOME/theos/toolchain/linux/iphone/bin/clang++ 2>/dev/null || true

      - name: Download iOS SDKs
        run: |
          set -e
          mkdir -p $HOME/theos/sdks
          git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git
          cp -R iOS-SDKs/*.sdk $HOME/theos/sdks/
          rm -rf iOS-SDKs
          ls -la $HOME/theos/sdks/

      - name: Build package
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roothide1.0-deb
          path: packages/*.deb
          if-no-files-found: error
