name: Build Roothide1.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git perl unzip curl wget lld libxml2-dev xz-utils

      - name: Setup roothide Theos
        run: |
          set -e
          export THEOS=$HOME/theos

          # Официальный установщик roothide (без sed-хаков)
          CI=1 bash -c "$(curl -fsSL https://github.com/roothide/theos/raw/refs/heads/master/bin/install-theos)" || true

          # Принудительная проверка: если clang нет — качаем тулчейн L1ghtmann вручную
          if [ ! -f "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            echo "=== Toolchain not found, installing L1ghtmann manually ==="
            mkdir -p "$THEOS/toolchain/linux/iphone"
            curl -L https://github.com/L1ghtmann/iOSToolchain/releases/download/v1.0.0/linux-ios-arm64e-clang-toolchain.tar.lzma -o /tmp/toolchain.tar.lzma
            tar --strip-components=1 -xf /tmp/toolchain.tar.lzma -C "$THEOS/toolchain/linux/iphone"
            rm /tmp/toolchain.tar.lzma
          fi

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roothide1.0-deb
          path: packages/*.deb
          if-no-files-found: error
